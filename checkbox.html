<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox</title>
</head>
<body>
    <h1>My Skills</h1>
    <form action="">
        <label for="Name">Name</label>
        <input type="text" id="Name">
        <label for="Skills">Skills:</label><br>
        <input type="checkbox" id="HTML" value="html"><label for="html">HTML</label><br>
        <input type="checkbox" id="CSS" value="CSS"><label for="CSS">CSS</label><br>
        <input type="checkbox" id="JS" value="JS"><label for="JS">JS</label><br>
        <input type="checkbox" id="React" value="React"><label for="React">React</label><br>
        <button>Submit</button>
    </form>
</body>
</html>
